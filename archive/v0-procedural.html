<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petalgram</title>
<style>
  :root{--paper:#f3f0e8;--ink:#1b1830;--mute:#8a8599;--line:rgba(27,24,48,.12)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
    font:13px/1.4 ui-monospace,"SF Mono",Menlo,monospace}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:20px 24px;pointer-events:none;mix-blend-mode:multiply}
  .brand{font-weight:700;letter-spacing:.2em}
  .meta{color:var(--mute);text-align:right}
  .hero{position:fixed;left:24px;bottom:96px;max-width:440px;pointer-events:none;transition:color .4s}
  .hero h1{font:400 clamp(30px,4.6vw,60px)/1.02 "Iowan Old Style","Times New Roman",serif;letter-spacing:-.02em}
  .hero p{margin-top:14px;color:var(--mute);max-width:360px}
  .bar{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    padding:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 80%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px}
  .grp{display:flex;gap:4px;align-items:center}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;
    padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--ink)}
  button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sw{width:22px;height:22px;padding:0;border-radius:50%}
  label{display:flex;gap:8px;align-items:center;color:var(--mute)}
  input[type=range]{width:110px;accent-color:var(--ink)}
  .hint{margin-left:auto;color:var(--mute)}
  body.dark{--paper:#0c0b12;--ink:#ecebff;--mute:#77748a;--line:rgba(236,235,255,.14)}
  body.dark header{mix-blend-mode:screen}
  @media (max-width:700px){.hint{display:none}.hero{bottom:150px}.meta{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><div class="brand">PETALGRAM</div><div class="meta" id="meta">—</div></header>
<div class="hero">
  <h1>A flower made of<br>characters.</h1>
  <p>No footage. Every petal is grown in a shader, lit in 3D, then translated into type, dots and noise — live, at 60fps.</p>
</div>
<div class="bar">
  <div class="grp" id="modes">
    <button data-m="0" class="on">ASCII</button><button data-m="1">Bayer</button><button data-m="2">Halftone</button><button data-m="3">Mixed</button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="pals"></div>
  <div class="sep"></div>
  <label>cell <input id="cell" type="range" min="5" max="22" value="10"></label>
  <button id="bloom">Rebloom</button>
  <button id="save">PNG</button>
  <span class="hint">1–4 模式 · 空格暂停 · 点击起风 · 鼠标是放大镜</span>
</div>
<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
if(!gl){document.body.innerHTML='<p style="padding:24px">需要 WebGL2</p>';throw 0}

const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;

// ---------- Pass 1: procedural flower (r=lum, g=layer, b=coverage) ----------
const SCENE=`#version 300 es
precision highp float;
uniform vec2 uRes,uMouse;uniform float uTime,uBloom,uGust;
out vec4 o;
float h1(float n){return fract(sin(n)*43758.5453);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
const vec3 LIGHT=normalize(vec3(-.55,.65,.75));
// paint one petal over res (painter's algorithm)
void petal(vec2 p,float ang,float len,float wid,float seed,float layer,float px,inout vec4 res){
  if(len<.001)return;
  float a=ang+(noise(vec2(seed*7.3,uTime*.3))-.5)*(.1+uGust*.35);
  float ca=cos(a),sa=sin(a);
  vec2 q=vec2(ca*p.x+sa*p.y,-sa*p.x+ca*p.y);
  float t=q.x/len;
  if(t<=0.||t>=1.03)return;
  t=min(t,.9999);
  float ruff=1.+.07*t*sin(t*21.+seed*5.+uTime*.9)+.04*sin(t*57.+seed);
  float w=wid*pow(sin(3.14159*pow(t,.75)),.7)*ruff;
  float s=q.y/max(w,1e-4);
  float edge=abs(s);
  float aa=px/max(w,1e-4)*1.5;
  float cov=1.-smoothstep(1.-aa,1.,edge);
  cov*=1.-smoothstep(1.-px/len*2.,1.,t);
  if(cov<=0.)return;
  // cupped surface normal, rotated back to world
  vec3 nl=normalize(vec3(-.9*(t-.35)-.5*t*t,-1.25*s*(1.-.4*t),1.));
  vec3 n=vec3(nl.x*ca-nl.y*sa,nl.x*sa+nl.y*ca,nl.z);
  float d=max(dot(n,LIGHT),0.);
  float lum=.18+.82*d;
  lum+=.22*pow(t,2.2);                                   // translucent tip
  lum*=mix(.35,1.,smoothstep(0.,.38,t));                 // dark throat
  float veins=.5+.5*cos(s*(18.+10.*t)+noise(q*40.)*2.);
  lum*=1.-.16*veins*(1.-t)*smoothstep(.05,.3,t);
  lum*=.72+.28*smoothstep(1.,.82,edge);                  // rim
  lum*=.8+.2*noise(q*90.+seed);                          // grain
  res=mix(res,vec4(clamp(.08+lum*.72,0.,1.),layer,1.,0.),cov);
}
void main(){
  float m=min(uRes.x,uRes.y);
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/m;
  vec2 mo=(uMouse-.5*uRes)/m;
  // cursor repels the surface
  vec2 dm=uv-mo;float fall=exp(-dot(dm,dm)*28.);
  uv-=normalize(dm+1e-5)*.045*fall;
  float px=1./m;
  vec4 res=vec4(1.,0.,0.,0.);
  float S=.78;
  vec2 C=uRes.x>uRes.y?vec2(.34*uRes.x/m,-.12):vec2(.12,.18);
  vec2 p=uv-C;
  // tilted view + slow spin
  float rot=uTime*.04;
  p=mat2(cos(rot),-sin(rot),sin(rot),cos(rot))*p;
  p.y/=.82;p/=S;
  float r=length(p);
  float breath=1.+.015*sin(uTime*1.1);
  // outer ring
  for(int i=0;i<6;i++){float fi=float(i);
    float b=smoothstep(0.,.7,uBloom-fi*.03);
    petal(p,fi*1.0472+.2,1.02*b*breath*(.92+.1*h1(fi)),.36*mix(.4,1.,b),fi,.0,px/S,res);}
  // shadow cast by inner petals on outer ring
  if(res.b>.5)res.r*=mix(.5,1.,smoothstep(.1,.6,r));
  for(int i=0;i<5;i++){float fi=float(i);
    float b=smoothstep(.15,.85,uBloom-fi*.03);
    petal(p,fi*1.2566+.75,.72*b*breath,.29*mix(.4,1.,b),fi+10.,.45,px/S,res);}
  if(res.b>.5)res.r*=mix(.55,1.,smoothstep(.05,.32,r));
  for(int i=0;i<5;i++){float fi=float(i);
    float b=smoothstep(.3,1.,uBloom-fi*.03);
    petal(p,fi*1.2566+.1+uTime*.05,.4*b*breath,.2*mix(.5,1.,b),fi+20.,.8,px/S,res);}
  // stamens: accent layer (1.0)
  float sb=smoothstep(.55,1.,uBloom);
  for(int i=0;i<9;i++){float fi=float(i);
    float a=fi*.698+.3*sin(uTime*.7+fi);
    float L=(.14+.06*h1(fi+3.))*sb;
    vec2 tip=vec2(cos(a),sin(a))*L;
    vec2 pa=p;float hh=clamp(dot(pa,tip)/max(dot(tip,tip),1e-5),0.,1.);
    float dl=length(pa-tip*hh);
    float c=1.-smoothstep(.006,.006+px/S*2.,dl)+ (1.-smoothstep(.022,.022+px/S*2.,length(pa-tip)));
    c=clamp(c,0.,1.)*sb;
    res=mix(res,vec4(.12+.5*hh*hh,1.,1.,0.),c);}
  // drifting loose petals
  for(int i=0;i<5;i++){float fi=float(i);
    float sp=.035+.02*h1(fi+7.);
    float T=uTime*sp*(1.+uGust*3.)+h1(fi)*10.;
    vec2 o2=vec2(fract(T+h1(fi+1.))*3.4-1.7,.9-fract(T*.7+h1(fi+2.))*2.2);
    o2.x+=.12*sin(T*6.+fi);
    vec2 q=(uv-o2*vec2(uRes.x/m*.6,.6))/.22;
    petal(q,uTime*.6+fi*2.,.5,.2,fi+40.,.3,px/.22,res);}
  o=res;
}`;

// ---------- Pass 2: characters / dither ----------
const POST=`#version 300 es
precision highp float;
uniform sampler2D uScene,uAtlas;
uniform vec2 uRes,uMouse;uniform float uCell,uN,uMode,uTime,uIntro,uLens,uDark;
uniform vec3 uInk1,uInk2,uAcc,uPaper;uniform float uDebug;
out vec4 o;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float b2(vec2 a){a=floor(a);return fract(dot(a,vec2(.5,a.y*.75)));}
float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
float b8(vec2 a){return b4(.5*a)*.25+b2(a);}
float glyph(float idx,vec2 cuv){return texture(uAtlas,vec2((idx+cuv.x)/uN,1.-cuv.y)).r;}
// returns (coverage, layer)
vec2 cellShade(vec2 f,float cell,float mode){
  vec2 cid=floor(f/cell),cuv=fract(f/cell);
  vec2 ctr=(cid+.5)*cell;
  vec4 sc=texture(uScene,ctr/uRes);
  float ink=clamp((1.-sc.r)*sc.b,0.,1.);
  ink=pow(ink,.85);
  float rv=hash(cid*.73)*.55+(1.-ctr.y/uRes.y)*.35;
  float k=smoothstep(rv,rv+.1,uIntro);
  float cov=0.;
  if(mode<.5||(mode>2.5&&hash(cid+floor(uTime*.8)*.01)>.5+.35*sin(ctr.x*.004+uTime*.5))){
    float idx=clamp(floor(ink*(uN-1.)+b4(cid)*.999),0.,uN-1.);
    if(ink<.02)idx=0.;
    cov=glyph(idx,cuv);
  }else if(mode<1.5){
    float dp=max(cell/3.,2.);
    vec2 sub=floor(f/dp);
    vec4 s2=texture(uScene,(sub+.5)*dp/uRes);
    float ik=clamp((1.-s2.r)*s2.b,0.,1.);
    cov=step(b8(sub)+.02,ik*1.05)*(1.-smoothstep(.3,.5,length(fract(f/dp)-.5)));
  }else{
    // halftone rotated 30°
    mat2 R=mat2(.866,-.5,.5,.866);
    vec2 g=R*f/cell;vec2 gid=floor(g);
    vec4 s3=texture(uScene,(transpose(R)*(gid+.5))*cell/uRes);
    float ik=clamp((1.-s3.r)*s3.b,0.,1.);
    float rad=sqrt(ik)*.62;
    cov=1.-smoothstep(rad-.08,rad,length(fract(g)-.5));
    sc=s3;
  }
  // scramble reveal
  if(k<1.){
    float ri=floor(hash(cid+floor(uTime*20.))*uN);
    float sc2=glyph(ri,cuv)*sc.b*(.15+.5*(1.-k))*step(.3,hash(cid+9.));
    cov=mix(sc2,cov,k);
  }
  return vec2(cov,sc.g);
}
vec3 colorOf(float layer,float f){
  vec3 c=mix(uInk1,uInk2,smoothstep(.1,.85,layer));
  return mix(c,uAcc,step(.95,layer));
}
void main(){
  vec2 f=gl_FragCoord.xy;
  if(uDebug>.5){vec4 t=texture(uScene,f/uRes);o=vec4(vec3(t.r),1);return;}
  vec2 a=cellShade(f,uCell,uMode);
  float d=length(f-uMouse);
  float R=uLens;
  float inL=1.-smoothstep(R-1.5,R,d);
  if(inL>0.){
    vec2 b=cellShade(f+ (f-uMouse)*.0,max(uCell*.45,2.5),uMode);
    a=mix(a,b,inL);
  }
  vec3 col=mix(uPaper,colorOf(a.y,a.x),a.x);
  // lens ring + ticks
  float ring=1.-smoothstep(0.,1.2,abs(d-R));
  float ang=atan(f.y-uMouse.y,f.x-uMouse.x);
  float tick=step(.92,fract(ang*6.366))*(1.-smoothstep(0.,1.2,abs(d-R-6.)))*step(d,R+10.);
  col=mix(col,uInk2,max(ring*.6,tick*.5)*step(0.,uMouse.x));
  // paper grain + vignette
  col+=(hash(f+fract(uTime))-.5)*.025;
  o=vec4(col,1.);
}`;

function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name;u[nm]=gl.getUniformLocation(p,nm)}
  return{p,u}}
const PS=prog(SCENE),PP=prog(POST);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

// glyph atlas, sorted by measured ink coverage
const CH=" .`'·,:;-~_^\"=+<>*!/?|ixcvnoz%sa&XHMW#@$8B▒▓█".split('');
const GS=48;let N=0;
function buildAtlas(){
  const c=document.createElement('canvas');c.width=GS;c.height=GS;const x=c.getContext('2d',{willReadFrequently:true});
  const list=[];
  for(const ch of CH){x.fillStyle='#000';x.fillRect(0,0,GS,GS);x.fillStyle='#fff';
    x.font=`600 ${GS*.86}px ui-monospace,Menlo,monospace`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(ch,GS/2,GS/2+2);const d=x.getImageData(0,0,GS,GS).data;let s=0;for(let i=0;i<d.length;i+=4)s+=d[i];
    list.push({ch,v:s/(255*GS*GS)})}
  list.sort((a,b)=>a.v-b.v);
  // keep a monotonic, well-spread ramp
  const out=[list[0]];for(const g of list)if(g.v>out[out.length-1].v+.018)out.push(g);
  N=out.length;
  const A=document.createElement('canvas');A.width=GS*N;A.height=GS;const ax=A.getContext('2d');
  ax.fillStyle='#000';ax.fillRect(0,0,A.width,A.height);ax.fillStyle='#fff';
  ax.font=`600 ${GS*.86}px ui-monospace,Menlo,monospace`;ax.textAlign='center';ax.textBaseline='middle';
  out.forEach((g,i)=>ax.fillText(g.ch,i*GS+GS/2,GS/2+2));
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,A);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t}
const atlas=buildAtlas();

let fbo,sceneTex,W,H,SW,SH;
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr|0;H=cv.height=innerHeight*dpr|0;
  SW=W>>1;SH=H>>1;
  if(sceneTex)gl.deleteTexture(sceneTex);if(fbo)gl.deleteFramebuffer(fbo);
  sceneTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,SW,SH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,sceneTex,0);
}
addEventListener('resize',resize);resize();

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const PALS=[
  {n:'Iris',paper:'#f3f0e8',i1:'#8c7bff',i2:'#3b25c9',acc:'#ff5a2e',dark:0},
  {n:'Ember',paper:'#f6efe4',i1:'#ff8a3d',i2:'#b3122e',acc:'#1f2a8a',dark:0},
  {n:'Night',paper:'#0c0b12',i1:'#6ef0ff',i2:'#b89cff',acc:'#ffe45c',dark:1},
  {n:'Ink',paper:'#efece4',i1:'#5a5a5a',i2:'#111111',acc:'#e0301e',dark:0},
];
const DEBUG=location.hash==='#debug'?1:0;
let pal=0,mode=0,cell=10,paused=false,time=0,last=performance.now();
let bloom=0,intro=0,gust=0,mouse=[-9999,-9999],mTarget=[-9999,-9999],lens=0,lensT=0;
const pe=document.getElementById('pals');
PALS.forEach((p,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.title=p.n;
  b.style.background=`linear-gradient(135deg,${p.i1},${p.i2} 60%,${p.acc})`;b.onclick=()=>setPal(i);pe.appendChild(b)});
function setPal(i){pal=i;[...pe.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  document.body.classList.toggle('dark',!!PALS[i].dark);document.body.style.setProperty('--paper',PALS[i].paper)}
function setMode(m){mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',+b.dataset.m===m))}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
const cellIn=document.getElementById('cell');cellIn.oninput=()=>cell=+cellIn.value;
function rebloom(){bloom=0;intro=0}
document.getElementById('bloom').onclick=rebloom;
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='petalgram.png';a.href=cv.toDataURL('image/png');a.click()};
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4')setMode(+e.key-1);
  if(e.code==='Space'){paused=!paused;e.preventDefault()}if(e.key==='r')rebloom()});
const dpr=()=>W/innerWidth;
cv.addEventListener('pointermove',e=>{mTarget=[e.clientX*dpr(),(innerHeight-e.clientY)*dpr()];lensT=1;
  if(mouse[0]<-999)mouse=[...mTarget]});
cv.addEventListener('pointerleave',()=>lensT=0);
cv.addEventListener('pointerdown',()=>gust=1);

const meta=document.getElementById('meta');let fps=60,fc=0,ft=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(!paused){time+=dt;bloom=Math.min(bloom+dt/3.2,1.2);intro=Math.min(intro+dt/2.2,1.2)}
  gust*=Math.pow(.25,dt);
  mouse[0]+=(mTarget[0]-mouse[0])*Math.min(dt*12,1);mouse[1]+=(mTarget[1]-mouse[1])*Math.min(dt*12,1);
  lens+=(lensT-lens)*Math.min(dt*8,1);
  const eb=1-Math.pow(1-Math.min(bloom,1),3);
  const sc=W/SW;
  // pass 1
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,SW,SH);gl.useProgram(PS.p);
  gl.uniform2f(PS.u.uRes,SW,SH);gl.uniform2f(PS.u.uMouse,mouse[0]/sc,mouse[1]/sc);
  gl.uniform1f(PS.u.uTime,time);gl.uniform1f(PS.u.uBloom,eb*1.15);gl.uniform1f(PS.u.uGust,gust);
  gl.drawArrays(gl.TRIANGLES,0,3);
  // pass 2
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(PP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneTex);gl.uniform1i(PP.u.uScene,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,atlas);gl.uniform1i(PP.u.uAtlas,1);
  const P=PALS[pal],d=dpr();
  gl.uniform2f(PP.u.uRes,W,H);gl.uniform2f(PP.u.uMouse,mouse[0],mouse[1]);
  gl.uniform1f(PP.u.uCell,cell*d);gl.uniform1f(PP.u.uN,N);gl.uniform1f(PP.u.uMode,mode);
  gl.uniform1f(PP.u.uTime,time);gl.uniform1f(PP.u.uIntro,intro);gl.uniform1f(PP.u.uLens,lens*110*d);
  gl.uniform3fv(PP.u.uInk1,hex(P.i1));gl.uniform3fv(PP.u.uInk2,hex(P.i2));gl.uniform3fv(PP.u.uAcc,hex(P.acc));
  gl.uniform3fv(PP.u.uPaper,hex(P.paper));gl.uniform1f(PP.u.uDebug,DEBUG);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fc++;ft+=dt;if(ft>.5){fps=fc/ft;fc=0;ft=0;
    meta.textContent=`${['ASCII','BAYER 8×8','HALFTONE 30°','MIXED'][mode]} · ${N} glyphs · ${Math.round(W/(cell*d))}×${Math.round(H/(cell*d))} cells · ${fps|0}fps`}
  requestAnimationFrame(frame)}
