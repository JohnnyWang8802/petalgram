<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petalgram</title>
<style>
  :root{--paper:#f4f6f9;--ink:#0d2150;--mute:#8a93a8;--line:rgba(13,33,80,.12)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
    font:12px/1.45 ui-monospace,"SF Mono",Menlo,monospace;transition:background .5s}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
  .corner{position:fixed;pointer-events:none}
  .tl{top:22px;left:24px}.tr{top:22px;right:24px;text-align:right;color:var(--mute)}
  .bl{left:24px;bottom:84px;max-width:300px}
  .brand{font-weight:700;letter-spacing:.24em}
  .bl h1{font:400 clamp(24px,3vw,40px)/1.05 "Iowan Old Style","Times New Roman",serif;letter-spacing:-.015em}
  .bl p{margin-top:10px;color:var(--mute)}
  .bar{position:fixed;left:16px;right:16px;bottom:16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
    padding:7px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 78%,transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:10px}
  .grp{display:flex;gap:4px;align-items:center}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;
    padding:5px 9px;cursor:pointer}
  button:hover{border-color:var(--ink)}
  button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sw{width:20px;height:20px;padding:0;border-radius:50%}
  label{display:flex;gap:6px;align-items:center;color:var(--mute)}
  input[type=range]{width:90px;accent-color:var(--ink)}
  .hint{margin-left:auto;color:var(--mute)}
  body.dark{--ink:#dfe8ff;--mute:#6f7890;--line:rgba(223,232,255,.14)}
  .corner,.bar{transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
  body.pre .corner,body.pre .bar{opacity:0}
  body.pre .bar{transform:translateY(24px)}
  body.pre .tl{transform:translateY(-10px)}
  .bar{transition-delay:.35s}.tr{transition-delay:.2s}
  @media (max-width:760px){.hint,.tr{display:none}.bl{bottom:140px}}
</style>
</head>
<body class="pre">
<canvas id="c"></canvas>
<div class="corner tl brand">PETALGRAM</div>
<div class="corner tr" id="meta">—</div>
<div class="corner bl">
  <h1>Four petals,<br>forty thousand dots.</h1>
  <p>一张静态图，经极坐标形变“活”过来，再以四阶有序抖动与字符重新排版。</p>
</div>
<div class="bar">
  <div class="grp" id="modes">
    <button data-m="0" class="on">Dither</button><button data-m="1">Blend</button><button data-m="2">ASCII</button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="pals"></div>
  <div class="sep"></div>
  <label>grain <input id="cell" type="range" min="2" max="10" step=".5" value="3"></label>
  <button id="bloom">Rebloom</button>
  <button id="save">PNG</button>
  <span class="hint">1–3 模式 · 空格暂停 · 按住起风 · 鼠标是放大镜</span>
</div>
<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
if(!gl){document.body.innerHTML='<p style="padding:24px">需要 WebGL2</p>';throw 0}

const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const FS=`#version 300 es
precision highp float;
uniform sampler2D uImg,uAtlas;
uniform vec2 uRes,uMouse,uImgSize;
uniform float uCell,uN,uMode,uTime,uIntro,uGust,uLens,uDebug;
uniform vec3 uC0,uC1,uC2,uC3,uAcc;
out vec4 o;
const vec2 CTR=vec2(.5025,.4943);            // flower centre in image uv (y up)
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float b2(vec2 a){a=floor(a);return fract(dot(a,vec2(.5,a.y*.75)));}
float b4(vec2 a){return b2(.5*a)*.25+b2(a);}
float b8(vec2 a){return b4(.5*a)*.25+b2(a);}

float sampleInk(vec2 src){                    // src: image-height units around CTR
  float asp=uImgSize.x/uImgSize.y;
  vec2 uv=CTR+src*vec2(1./asp,1.);
  if(uv.x<0.||uv.y<0.||uv.x>1.||uv.y>1.)return 0.;
  vec3 c=texture(uImg,vec2(uv.x,1.-uv.y)).rgb;
  float lum=dot(c,vec3(.45,.4,.15));           // blue ink reads dark in R/G
  return pow(clamp((.955-lum)/.62,0.,1.),.68);
}
const float PI=3.14159265;
const vec4 AXES=vec4(52.,134.,225.,319.)*PI/180.;   // petal axes in the source image
float wrapA(float x){return mod(x+PI,2.*PI)-PI;}
// screen px -> ink density of the living flower.
// Each petal is its own rigid-ish body: it swings, turns edge-on (width squash),
// stretches, and whips at the tip. Petals are unioned with max().
float inkAt(vec2 f){
  float H=min(uRes.y,uRes.x/1.25);
  float K=1.02-.05*sin(uTime*.21);
  vec2 q=(f-.5*uRes)/H*K;
  q-=vec2(.02*sin(uTime*.23),.018*cos(uTime*.19));
  vec2 mq=(uMouse-.5*uRes)/H*K;
  vec2 dm=q-mq;float dl=length(dm);
  float lensR=uLens/H*K;
  if(lensR>0.){float k=1.-smoothstep(0.,lensR,dl);q=mq+dm*(1.-.45*k*k);}
  float r=length(q),a=atan(q.y,q.x);
  a-=uTime*.09;                                // whole flower slowly turns
  float t=uTime*(1.+uGust*1.6);
  float amp=1.+uGust*1.3;
  float ma=atan(mq.y,mq.x)-uTime*.09,mr=length(mq);
  float ink=0.;
  for(int i=0;i<4;i++){
    float fi=float(i),ax=AXES[i];
    float swing=amp*(.30*sin(t*.62+fi*1.9)+.12*sin(t*1.37+fi*4.1));
    float squash=.82+amp*.36*sin(t*.85+fi*2.6+.7);            // <1: petal turns edge-on
    squash=max(squash,.3);
    float stretch=1.+amp*.14*sin(t*.74+fi*1.3+2.);
    // cursor shoves the nearest petal aside
    float near=exp(-pow(wrapA(ma-ax)/.5,2.))*smoothstep(.55,.1,abs(mr-.25));
    swing+=.35*near*sign(wrapA(ma-ax)+1e-3)*step(0.,uMouse.x)*uLens/max(uLens,1.);
    float rs=r/stretch;
    float whip=amp*.32*sin(t*1.05+fi*2.2-rs*4.)*pow(rs/.5,1.6); // tip lags behind
    float da=wrapA(a-(ax+swing+whip));
    if(abs(da)>PI*.5)continue;
    float sda=da/squash;
    float m=1.-smoothstep(PI*.2,PI*.25,abs(sda));             // stay inside own sector
    float pk=sampleInk(vec2(cos(ax+sda),sin(ax+sda))*rs)*m;
    pk*=pow(1./squash,.45);                                 // edge-on reads denser
    ink=max(ink,pk);
  }
  return clamp(ink,0.,1.)*smoothstep(0.,.9,uIntro);
}
vec3 tone(float lv){return lv<.5?uC0:lv<1.5?uC1:lv<2.5?uC2:uC3;}
float glyph(float idx,vec2 cuv){return texture(uAtlas,vec2((idx+cuv.x)/uN,1.-cuv.y)).r;}

void main(){
  vec2 f=gl_FragCoord.xy;
  if(uDebug>.5){o=vec4(vec3(1.-inkAt(f)),1);return;}
  float cell=uCell;
  vec2 cid=floor(f/cell),cuv=fract(f/cell);
  vec2 ctr=(cid+.5)*cell;
  float ink=inkAt(ctr);
  // light sweep: a slow diagonal glint that nudges the threshold
  float sw=dot(ctr/uRes,vec2(.8,.6))-fract(uTime*.07)*2.2+.3;
  ink=clamp(ink+.12*exp(-sw*sw*60.)*step(.01,ink),0.,1.);
  vec3 col=uC0;
  float dotMask=1.-smoothstep(.36,.5,max(abs(cuv.x-.5),abs(cuv.y-.5))-.02);
  // 4-level ordered dither
  float lv=floor(clamp(ink*3.+b8(cid),0.,3.));
  vec3 dcol=mix(uC0,tone(lv),lv>0.?dotMask:0.);
  if(uMode<.5){col=dcol;}
  else{
    float gc=max(cell*(uMode>1.5?2.6:3.),7.);
    vec2 gid=floor(f/gc),guv=fract(f/gc);
    vec2 gctr=(gid+.5)*gc;
    float gi=inkAt(gctr);
    float idx=clamp(floor(gi*(uN-1.)+b4(gid)*.9),0.,uN-1.);
    float g=glyph(idx,guv);
    vec3 gcol=mix(uC2,uC3,smoothstep(.35,.85,gi));
    if(uMode>1.5){col=mix(uC0,gcol,g);}
    else{float w=step(.55,gi);col=mix(dcol,mix(uC1,gcol,g),w);}
  }
  // cursor reticle
  float d=length(f-uMouse);
  float ring=(1.-smoothstep(0.,1.2,abs(d-uLens)))*step(1.,uLens);
  float cross=(1.-smoothstep(0.,1.,min(abs(f.x-uMouse.x),abs(f.y-uMouse.y))))*step(d,7.)*step(3.,d);
  col=mix(col,uAcc,max(ring*.7,cross));
  col+=(hash(f+fract(uTime))-.5)*.018;
  o=vec4(col,1);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x}
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,VS));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(P,0,'p');gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(P));
const U={};for(let i=0,n=gl.getProgramParameter(P,gl.ACTIVE_UNIFORMS);i<n;i++){const nm=gl.getActiveUniform(P,i).name;U[nm]=gl.getUniformLocation(P,nm)}
gl.useProgram(P);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

function tex(src){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}

// glyph atlas sorted by measured coverage
const CH=" .`'·,:;-~^\"=+<>*!/?|ixcvnoz%sa&XHMW#@$8B".split('');const GS=48;let N=0;
function atlas(){const c=document.createElement('canvas');c.width=c.height=GS;const x=c.getContext('2d',{willReadFrequently:true});
  const font=`600 ${GS*.9}px ui-monospace,Menlo,monospace`;const L=[];
  for(const ch of CH){x.fillStyle='#000';x.fillRect(0,0,GS,GS);x.fillStyle='#fff';x.font=font;x.textAlign='center';x.textBaseline='middle';
    x.fillText(ch,GS/2,GS/2+2);const d=x.getImageData(0,0,GS,GS).data;let s=0;for(let i=0;i<d.length;i+=4)s+=d[i];L.push({ch,v:s/(255*GS*GS)})}
  L.sort((a,b)=>a.v-b.v);const out=[L[0]];for(const g of L)if(g.v>out[out.length-1].v+.015)out.push(g);N=out.length;
  const A=document.createElement('canvas');A.width=GS*N;A.height=GS;const ax=A.getContext('2d');
  ax.fillStyle='#000';ax.fillRect(0,0,A.width,GS);ax.fillStyle='#fff';ax.font=font;ax.textAlign='center';ax.textBaseline='middle';
  out.forEach((g,i)=>ax.fillText(g.ch,i*GS+GS/2,GS/2+2));return tex(A)}

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const PALS=[
  {n:'Porcelain',c:['#f4f6f9','#bcd0ef','#4f7fd0','#0b2a78'],acc:'#ff4d2e'},
  {n:'Iris',c:['#f6f4fb','#cfc6ff','#8b78ff','#3a22c4'],acc:'#ff6a3d'},
  {n:'Ember',c:['#f7f1e8','#f5c7a0','#e8683a','#8a1426'],acc:'#1d3bd1'},
  {n:'Night',c:['#070a14','#1c2c5c','#4d86ff','#d6e6ff'],acc:'#ffd23f',dark:1},
];
let pal=0,mode=0,cell=3,paused=false,time=0,last=performance.now();
let revealed=false;
let intro=0,gust=0,holding=false,mouse=[-1e4,-1e4],mT=[-1e4,-1e4],lens=0,lensT=0,W,H,dpr;
const DEBUG=location.hash==='#debug'?1:0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr|0;H=cv.height=innerHeight*dpr|0}
addEventListener('resize',resize);resize();

const pe=document.getElementById('pals');
PALS.forEach((p,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.title=p.n;
  b.style.background=`conic-gradient(${p.c[1]},${p.c[2]},${p.c[3]},${p.c[1]})`;b.onclick=()=>setPal(i);pe.appendChild(b)});
function setPal(i){pal=i;[...pe.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  document.body.classList.toggle('dark',!!PALS[i].dark);document.body.style.setProperty('--paper',PALS[i].c[0])}
function setMode(m){mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',+b.dataset.m===m))}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
const cellIn=document.getElementById('cell');cellIn.oninput=()=>cell=+cellIn.value;
const rebloom=()=>{intro=0;revealed=false;document.body.classList.add('pre')};
document.getElementById('bloom').onclick=rebloom;
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='petalgram.png';a.href=cv.toDataURL('image/png');a.click()};
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='3')setMode(+e.key-1);
  if(e.code==='Space'){paused=!paused;e.preventDefault()}if(e.key==='r')rebloom()});
cv.addEventListener('pointermove',e=>{mT=[e.clientX*dpr,(innerHeight-e.clientY)*dpr];lensT=1;if(mouse[0]<-1e3)mouse=[...mT]});
cv.addEventListener('pointerleave',()=>{lensT=0;holding=false});
cv.addEventListener('pointerdown',()=>holding=true);
addEventListener('pointerup',()=>holding=false);

const img=new Image();img.src='flower.webp';
img.onload=()=>{
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  const imgTex=tex(img),atl=atlas();
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,imgTex);gl.uniform1i(U.uImg,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,atl);gl.uniform1i(U.uAtlas,1);
  gl.uniform2f(U.uImgSize,img.width,img.height);
  requestAnimationFrame(frame)};

const h1=document.querySelector('.bl h1'),h1src=h1.innerHTML,GL='#%@*+=-:.~<>/\\|';
function decode(el,html,dur){
  const text=html.replace(/<br>/g,'\n');const t0=performance.now();
  (function step(){const p=Math.min((performance.now()-t0)/dur,1);let out='';
    for(let i=0;i<text.length;i++){const c=text[i];const th=i/text.length*.7;
      out+=c==='\n'?'<br>':(p>th+.3||c===' ')?c:(p>th?GL[Math.random()*GL.length|0]:'&nbsp;')}
    el.innerHTML=out;if(p<1)requestAnimationFrame(step);else el.innerHTML=html})()}
function reveal(){revealed=true;document.body.classList.remove('pre');decode(h1,h1src,1100)}
h1.innerHTML='';
const meta=document.getElementById('meta');let fc=0,ft=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(!paused){time+=dt;intro=Math.min(intro+dt,30)}
  gust+=((holding?1:0)-gust)*Math.min(dt*(holding?1.5:.8),1);
  if(intro>.3&&!revealed)reveal();
  const s=Math.min(dt*10,1);mouse[0]+=(mT[0]-mouse[0])*s;mouse[1]+=(mT[1]-mouse[1])*s;
  lens+=(lensT-lens)*Math.min(dt*6,1);
  gl.viewport(0,0,W,H);
  const p=PALS[pal];
  gl.uniform2f(U.uRes,W,H);gl.uniform2f(U.uMouse,mouse[0],mouse[1]);
  gl.uniform1f(U.uCell,cell*dpr);gl.uniform1f(U.uN,N);gl.uniform1f(U.uMode,mode);
  gl.uniform1f(U.uTime,time);gl.uniform1f(U.uIntro,intro);gl.uniform1f(U.uGust,gust);
  gl.uniform1f(U.uLens,lens*90*dpr);gl.uniform1f(U.uDebug,DEBUG);
  ['uC0','uC1','uC2','uC3'].forEach((k,i)=>gl.uniform3fv(U[k],hex(p.c[i])));gl.uniform3fv(U.uAcc,hex(p.acc));
  gl.drawArrays(gl.TRIANGLES,0,3);
  fc++;ft+=dt;if(ft>.5){meta.textContent=`${['DITHER 4-TONE','BLEND','ASCII'][mode]} · ${Math.round(W/(cell*dpr))}×${Math.round(H/(cell*dpr))} · ${Math.round(fc/ft)}fps`;fc=0;ft=0}
  requestAnimationFrame(frame)}
</script>
</body>
</html>
